# docker-compose.yml
#
# 로컬 개발/시연용 구성. 배포용은 docker-compose.prod.yml 을 따로 둔다.
#
# 모든 값에 기본값이 있어 .env 없이도 `docker compose up -d` 로 뜬다.
# 값을 바꾸고 싶으면 .env.example 을 복사해 .env 를 만들고 채운다.

# ---------------------------------------------------------------------------
# DB 접속 문자열을 한 곳에서만 조립한다.
#
# 예전에는 같은 문자열이 migrate/backend/crawler 세 곳에 복붙돼 있었다.
# 비밀번호를 바꾸려면 세 곳을 모두 고쳐야 했고, 하나를 빠뜨리면 그 서비스만
# 조용히 연결에 실패한다 — 다른 두 곳은 멀쩡히 뜨기 때문에 원인을 찾기 어렵다.
#
# 컨테이너끼리는 서비스 이름으로 통신한다. 호스트의 DB_PORT와 무관하게
# 컨테이너 내부 포트인 5432를 그대로 쓴다.
# ---------------------------------------------------------------------------
x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cloudedx}:${POSTGRES_PASSWORD:-cloudedx}@db:5432/${POSTGRES_DB:-cloudedx}

services:
  db:
    image: postgres:16
    environment:
      # 이 세 값은 볼륨이 비어 있을 때(최초 기동)만 읽힌다. 이미 초기화된 뒤에
      # 바꾸면 컨테이너는 새 비밀번호로 접속을 시도하지만 DB에는 옛 비밀번호가
      # 남아 있어 인증에 실패한다. 바꾸려면 볼륨째 지운다: docker compose down -v
      POSTGRES_USER: ${POSTGRES_USER:-cloudedx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudedx}
      POSTGRES_DB: ${POSTGRES_DB:-cloudedx}
    ports:
      # 호스트 포트만 .env의 DB_PORT로 바꿀 수 있게 뺀다. 다른 프로젝트가 5432를
      # 쓰고 있으면 .env에 DB_PORT=5433을 넣으면 된다. 컨테이너 내부는 항상 5432.
      # 앱 컨테이너들은 이 포트를 거치지 않고 도커 네트워크로 직접 붙는다 —
      # 이 매핑은 psql이나 DBeaver로 호스트에서 들여다보기 위한 것이다.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cloudedx_pgdata:/var/lib/postgresql/data
    healthcheck:
      # 사용자명이 POSTGRES_USER와 어긋나면 healthcheck가 영영 통과하지 못하고,
      # depends_on에 걸린 나머지 서비스가 전부 기동하지 않는다. 같은 변수를 쓴다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudedx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 일회성 마이그레이션 서비스.
  #
  # 앱 시작 시 자동으로 돌리지 않는 이유: 백엔드를 2대로 늘리면 두 대가 동시에 같은
  # 마이그레이션을 돌리려 든다. 한 번만 실행되는 자리를 따로 두는 편이 안전하다.
  # 백엔드와 크롤러는 이 서비스가 성공적으로 끝날 때까지 기다린다.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: dockerfile.backend
    command: ["alembic", "upgrade", "head"]
    volumes:
      # 시드 스크립트(app.seed_demo)를 이 서비스로 돌리면 이미지를 여기에 쓴다.
      # backend와 같은 볼륨이어야 저장한 파일이 화면에서 서빙된다.
      - cloudedx_uploads:/srv/uploads
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    environment:
      # <<: 는 앵커의 키를 이 맵에 펼쳐 넣는다. migrate처럼 DB 설정만 쓰는 곳은
      # `environment: *db-env` 로 통째로 참조하고, 여기처럼 다른 값을 덧붙여야
      # 하는 곳은 <<: 로 병합한다.
      <<: *db-env

      # 크롤러는 별도 컨테이너가 담당한다. 여기서 켜면 두 곳에서 동시에 긁게 되고,
      # 애초에 이 이미지에는 Playwright가 없어서 시작하지도 못한다.
      ENABLE_CRAWLER: "false"

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # -----------------------------------------------------------------------
      # 세션 쿠키 서명 키를 고정한다.
      #
      # config.py는 이 값이 비어 있으면 secrets.token_hex(32)로 프로세스마다 새로
      # 만든다. 단일 컨테이너에서는 재시작할 때 로그인이 풀리는 정도로 끝나지만,
      # backend를 여러 대로 늘리면 각 컨테이너가 서로 다른 키로 서명하게 된다.
      # 리버스 프록시가 요청을 분배할 때마다 다른 컨테이너로 가므로, 로그인이
      # 붙었다 풀렸다를 반복한다. 원인을 모르면 인증 코드를 의심하게 되는데
      # 실제 원인은 여기다.
      #
      # 계정(admin/client)과 마찬가지로 시연 편의를 위한 고정값이다.
      # -----------------------------------------------------------------------
      SESSION_SECRET: ${SESSION_SECRET:-cloudedx-demo-session-key-do-not-use-in-production}
    volumes:
      # 판매자 업로드 이미지. 컨테이너를 다시 만들어도 남아야 하므로 볼륨이다.
      #
      # backend를 여러 대로 늘리면 세 대가 같은 볼륨을 봐야 한다. 로컬 compose는
      # 같은 호스트라 그대로 공유되지만, 여러 노드에 흩어지는 배포에서는 공유
      # 스토리지가 필요하다 — 그때는 이 자리가 오브젝트 스토리지로 바뀐다.
      - cloudedx_uploads:/srv/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # 마이그레이션이 성공으로 끝난 뒤에 뜬다. 스키마가 준비되기 전에
        # 트래픽을 받으면 없는 컬럼을 조회하다 500을 뱉는다.
        condition: service_completed_successfully
    healthcheck:
      # /health(liveness)가 아니라 /ready를 본다. compose에서는 이 상태가
      # depends_on의 기준이 되므로, DB와 스키마까지 확인하는 쪽이 맞다.
      # 이미지에 curl이 없어서 파이썬으로 확인한다.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # 컨테이너가 뜨는 동안의 실패는 재시도 횟수에서 빼준다.
      start_period: 20s
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: dockerfile.crawler
    environment:
      <<: *db-env
      CRAWL_INTERVAL_MINUTES: ${CRAWL_INTERVAL_MINUTES:-30}
      CRAWL_RETRY_MINUTES: ${CRAWL_RETRY_MINUTES:-5}
      CRAWL_RUN_TIMEOUT_MINUTES: ${CRAWL_RUN_TIMEOUT_MINUTES:-60}
      JOONGNA_PAGES_PER_BRAND: ${JOONGNA_PAGES_PER_BRAND:-3}
      BUNJANG_PAGES_PER_JOB: ${BUNJANG_PAGES_PER_JOB:-3}
      MISSING_THRESHOLD: ${MISSING_THRESHOLD:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Chromium은 탭마다 공유 메모리를 쓰는데 컨테이너 기본 /dev/shm이 64MB뿐이라
    # 페이지를 열다 죽는다. --disable-dev-shm-usage 플래그로 우회하는 방법도 있지만
    # 디스크를 대신 쓰게 되어 느려지므로, 메모리를 늘려주는 쪽을 택한다.
    shm_size: 1gb
    volumes:
      # 크롤링 결과 JSON 덤프(디버깅용). DB가 정본이라 없어도 동작한다.
      - cloudedx_crawler_data:/srv/data
    # 크롤러는 HTTP를 열지 않으므로 헬스체크가 없다. 상태는 crawl_runs 테이블에
    # 기록되고 백엔드의 /api/meta로 확인한다.
    restart: unless-stopped

volumes:
  cloudedx_pgdata:
  cloudedx_crawler_data:
  # 판매자가 올린 이미지. web/ 밑에 두지 않는 이유는 그쪽이 도커 이미지에 구워지고
  # git에 들어가는 디렉토리라서다 — 업로드 파일이 커밋될 수 있고, 이미지를 새로
  # 빌드할 때마다 사라진다.
  cloudedx_uploads:
