<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reverdi — 중고명품 통합검색</title>
  <meta name="description" content="당근마켓·중고나라·번개장터의 중고 명품 매물을 한곳에서 검색하고 비교하세요." />

  <meta property="og:title" content="Reverdi — 중고명품 통합검색" />
  <meta property="og:description" content="당근마켓·중고나라·번개장터의 중고 명품 매물을 한곳에서." />
  <meta property="og:type" content="website" />

  <!-- 브이월드 지도 인증키. 브라우저가 직접 호출하므로 여기 둔다 —
       백엔드는 폐쇄망에 있어 지도 서버에 나가지 못한다.
       비워 두면 지도 블록만 조용히 사라지고 나머지 화면은 그대로 동작한다.
       https://www.vworld.kr/dev/v4api.do 에서 발급받아 넣는다. -->
  <meta name="vworld-key" content="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+KR:wght@500;600;700&display=swap" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/reverdi.css" />
</head>
<body class="mode-home">

<!-- 아이콘 정의. 같은 아이콘을 여러 번 그리므로 <use>로 참조한다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-bag" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></g>
    <g id="i-watch" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 9v3l1.5 1.5M9 2h6l.5 4M9 22h6l.5-4"/></g>
    <g id="i-gem" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M2 9h20M12 21 8 9l2-6M12 21l4-12-2-6"/></g>
    <g id="i-shirt" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></g>
    <g id="i-shoe" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12.5V20"/><path d="M3 18c3 0 6-1 9-5l3.5-4.5C17 6.8 19.5 7.2 20.2 9L21 12c-2.5 1.2-5 3-7 6H3Z"/><path d="M12 13c2-2 4.5-3 6.5-2.5"/></g>
    <g id="i-ring" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"/><path d="m9 5 1-3h4l1 3M9 5h6l-1.5 3h-3Z"/></g>
    <g id="i-home" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M9.5 21v-6h5v6"/></g>
    <g id="i-sparkles" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.6 4.3L6 9l4.4 1.7L12 15l1.6-4.3L18 9l-4.4-1.7L12 3Z"/><path d="m5 14-.8 2.2L2 17l2.2.8L5 20l.8-2.2L8 17l-2.2-.8L5 14Z"/></g>

    <g id="i-search" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g>
    <g id="i-heart" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></g>
    <g id="i-user" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></g>
    <g id="i-seal" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9"/></g>
    <g id="i-arrow-r" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g>
  </defs>
</svg>

<header class="site">
  <div class="wrap header-row">
    <button class="logo" type="button" data-home aria-label="Reverdi 홈">rev<em>e</em>rdi</button>

    <div class="header-actions">
      <form class="search-pill" id="searchForm" role="search">
        <button type="submit" aria-label="검색"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></button>
        <label class="visually-hidden" for="searchInput">브랜드, 모델명 검색</label>
        <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
               placeholder="브랜드, 모델명 검색" />
      </form>
      <a class="icon-btn" href="login.html" aria-label="기업고객 로그인"><svg viewBox="0 0 24 24"><use href="#i-user"/></svg></a>
    </div>
  </div>

  <div class="wrap">
    <!-- 카테고리 링크는 /api/meta 응답으로 채운다. -->
    <nav class="main-nav" id="mainNav" aria-label="카테고리"></nav>
  </div>
</header>

<main>

<!-- ══════════════════════════════════════════ 대문 -->
<div class="home-view">

  <section class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-copy">
      <p class="hero-eyebrow">Curated Pre-loved Luxury</p>
      <h1 class="hero-title">다시, 봄</h1>
      <p class="hero-sub">당근마켓 · 중고나라 · 번개장터의 매물을 한곳에서</p>
      <button class="btn-primary" type="button" data-browse>
        매물 둘러보기
        <svg viewBox="0 0 24 24"><use href="#i-arrow-r"/></svg>
      </button>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="cat-grid" id="catGrid"></div>
    </div>
  </section>

  <section class="section section--flush">
    <div class="wrap">
      <div class="brand-scroll" id="brandScroll"></div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap">
      <div class="tab-row" role="tablist" aria-label="정렬">
        <button class="tab-btn" type="button" role="tab" data-rail="latest" aria-selected="true">신규 물품</button>
        <button class="tab-btn" type="button" role="tab" data-rail="authenticated" aria-selected="false">인증 물품</button>
      </div>
      <div class="rail" id="railGrid"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="promo">
        <div>
          <p class="promo-eyebrow">For Business</p>
          <h2 class="promo-title">보유 재고를 Reverdi에 올리세요</h2>
          <p class="promo-sub">기업고객 계정으로 CSV를 올리면 목록에 함께 노출됩니다.</p>
        </div>
        <a class="btn-primary" href="client.html">
          매물 등록하기
          <svg viewBox="0 0 24 24"><use href="#i-arrow-r"/></svg>
        </a>
      </div>
    </div>
  </section>

</div>

<!-- ══════════════════════════════════════════ 검색 결과 -->
<div class="list-view">
  <div class="wrap">

    <div class="results-head">
      <h1 class="results-title" id="resultTitle">전체 매물</h1>
      <p class="results-count" id="resultCount"></p>
    </div>

    <div class="filter-bar">
      <div class="filter-group" id="sourceChips" role="group" aria-label="수집처"></div>
      <div class="filter-group" id="brandChips" role="group" aria-label="브랜드"></div>
      <div class="filter-spacer"></div>
      <label class="visually-hidden" for="sortSelect">정렬</label>
      <select class="sort-select" id="sortSelect"></select>
    </div>

    <div class="grid" id="resultGrid"></div>

    <div class="pager" id="pager"></div>

  </div>
</div>

</main>

<!-- 입점 판매자 패널. 매물 카드를 누르면 채워진다. -->
<div class="seller-panel" id="sellerPanel" hidden></div>

<footer class="site">
  <div class="wrap footer-top">
    <div class="footer-brand">
      <div class="logo">rev<em>e</em>rdi</div>
      <p>국내 중고 거래 플랫폼의 명품 매물을 모아 한 화면에서 비교합니다. 거래는 각 플랫폼에서 이루어집니다.</p>
    </div>
    <div class="footer-col">
      <h5>서비스</h5>
      <a href="#" data-browse>전체 매물</a>
      <a href="/board">수집 현황</a>
      <a href="/docs">API 문서</a>
    </div>
    <div class="footer-col">
      <h5>기업고객</h5>
      <a href="login.html">로그인</a>
      <a href="client.html">매물 등록</a>
    </div>
    <div class="footer-col">
      <h5>수집처</h5>
      <p>당근마켓</p>
      <p>중고나라</p>
      <p>번개장터</p>
    </div>
  </div>
  <div class="wrap footer-bottom">
    <span>© 2026 Reverdi</span>
    <span id="lastCrawled"></span>
  </div>
</footer>

<script type="module" src="js/home.js"></script>
</body>
</html>
