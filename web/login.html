<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - Reverdi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Noto+Serif+KR:wght@500;600;700&display=swap" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

<!-- 비밀번호 표시 토글 아이콘. login.js가 aria-pressed로 눈/빗금눈을 바꾼다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-eye" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="i-eye-off" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></g>
  </defs>
</svg>

<main class="auth-shell">

  <div class="auth-mast">
    <a class="auth-logo" href="./" aria-label="Reverdi 홈">Reverdi</a>
    <p class="auth-eyebrow">Authorized Access Only</p>
  </div>

  <div class="auth-card">
    <div class="auth-card__inner">

      <form id="loginForm">
        <label class="field">
          <span class="field__label">아이디</span>
          <span class="field__control">
            <input id="username" name="username" type="text" autocomplete="username"
                   autocapitalize="off" spellcheck="false" required
                   placeholder="아이디를 입력하세요" />
          </span>
        </label>

        <div class="field">
          <label class="field__label" for="password">비밀번호</label>
          <span class="field__control">
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required
                   placeholder="비밀번호를 입력하세요" />
            <button class="pw-toggle" id="pwToggle" type="button"
                    aria-label="비밀번호 표시" aria-pressed="false">
              <svg class="i-eye" viewBox="0 0 24 24"><use href="#i-eye"/></svg>
              <svg class="i-eye-off" viewBox="0 0 24 24"><use href="#i-eye-off"/></svg>
            </button>
          </span>
        </div>

        <p class="auth-error" id="loginError" role="alert" hidden></p>

        <button class="auth-submit" id="loginSubmit" type="submit">로그인</button>
      </form>

      <!-- 시연 계정. 회원가입·비밀번호 재설정이 없는 시스템이라
           시안의 "Request Access" 자리를 이 블록이 맡는다. -->
      <div class="auth-demo">
        <p class="auth-demo__title">Demo Accounts</p>
        <button type="button" class="auth-demo__row" data-fill="admin">
          <strong>관리자</strong><code>admin / admin1234</code>
          <span>수집 현황·매물 분포 대시보드</span>
        </button>
        <button type="button" class="auth-demo__row" data-fill="client">
          <strong>기업고객</strong><code>client / client1234</code>
          <span>CSV로 매물 일괄 등록</span>
        </button>
      </div>

      <a class="auth-back" href="./">← 검색 화면으로 돌아가기</a>

    </div>
  </div>

</main>

<p class="auth-foot">Reverdi Console · CloudeDX</p>

<script type="module" src="js/login.js"></script>
</body>
</html>
