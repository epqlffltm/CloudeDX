# docker-compose.web.yml
name: reluxe-web
#
# 웹 계층. EC2 로 갈 경우 웹서버 3대(AZ당 1대)에 **동일하게** 배포된다.
# (1순위 배포는 ECS/EKS 태스크 데피니션이다 — docs/deploy-env.md 가 그 계약이고,
#  이 파일은 로컬 검증과 EC2 폴백용이다. 환경변수 목록도 그 문서가 정본이다.)
#
#     docker compose -f docker-compose.web.yml --env-file .env.web up -d
#
# 이 파일에 없는 것들:
#
#   db       별도 인스턴스(주/대기 스트리밍 복제)에 있다. DATABASE_URL 로만 붙는다.
#   crawler  별도 인스턴스. docker-compose.crawler.yml 참고.
#   migrate  운영 서버에서 배포 스크립트가 한 번만 돌린다.
#            docker-compose.migrate.yml 참고 — 웹서버 3대가 각자 마이그레이션을
#            돌리면 같은 리비전을 두고 락 경합이 일어난다.
#   nginx    **걷어냈다.** ALB 가 백엔드 컨테이너에 직결한다. 분산은 ALB 가 하고,
#            nginx 가 하던 일은 이미 앱으로 옮겨져 있다 — 보안 헤더·gzip 은
#            main.py 미들웨어, 액세스 로그는 ALB 액세스 로그가 정본.
#            중간 홉이 하나 줄어 X-Forwarded-For 신뢰 대역도 ALB(VPC 대역)
#            하나로 단순해졌다.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:-reluxe-backend:latest}
    # 이 서버에서는 1대다. 수평 확장은 ASG 가 인스턴스 단위로 한다.
    # 한 호스트에 여러 대를 띄우면 t3.small(2GB) 에서 메모리가 빠듯하다.
    ports:
      # ALB 만 이 포트로 들어온다(웹 SG 인바운드 8000 = ALB SG 에서만).
      # 웹서버에는 공인 IP 가 없으므로 인터넷에서 직접 닿을 경로가 없다.
      # /metrics 노출도 같은 원리로 막는다 — ALB 리스너 규칙에서 /metrics 를
      # 고정 404 로 돌리고, 수집기는 VPC 내부에서 8000 으로 직접 접근한다.
      - "8000:8000"
    environment:
      # -----------------------------------------------------------------
      # DB 접속.
      #
      # 조립하지 않고 통째로 받는다. Route 53 프라이빗 호스팅 영역의
      # db.reluxe.internal 을 가리키므로, 주 DB 장애 시 그 레코드만 대기 DB 로
      # 바꾸면 애플리케이션 설정을 건드리지 않아도 된다.
      #
      # 전환이 실제로 먹으려면 앱이 죽은 커넥션을 붙잡고 있으면 안 되는데,
      # engine.py 에 pool_pre_ping=True 가 걸려 있어 체크아웃할 때마다 살아있는지
      # 확인하고 죽었으면 새로 맺는다. 그 시점에 DNS 를 다시 조회한다.
      # -----------------------------------------------------------------
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 을 .env.web 에 설정하세요}

      # 수집은 크롤링 인스턴스가 전담한다. 여기서 켜면 웹서버 3대가 각자 긁게 되고,
      # 애초에 이 이미지에는 Playwright 가 없어 시작하지도 못한다.
      ENABLE_CRAWLER: "false"

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

      # -----------------------------------------------------------------
      # 세션 서명 키 — 웹서버 3대가 반드시 같은 값을 써야 한다.
      #
      # 로그인 상태는 서버에 저장되지 않고 HMAC 으로 서명한 쿠키에만 담긴다.
      # 서버 측 세션 저장소가 없으므로 ALB 스티키 세션은 필요 없지만, 그건
      # "3대가 같은 키로 서명한다"는 전제 위에서만 성립한다.
      #
      # 키가 서로 다르면 ALB 가 요청을 다른 서버로 보낼 때마다 쿠키 검증이
      # 실패해 로그인이 붙었다 풀렸다 한다. 증상은 앱 버그처럼 보이지만 원인은
      # 배포 설정이고, 3대로 흩어져 있으면 재현조차 어렵다.
      #
      # 비워두면 config.py 가 프로세스마다 임의 키를 만들므로, 미설정 시
      # 기동을 거부한다.
      # -----------------------------------------------------------------
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 을 .env.web 에 설정하세요 — 3대 모두 같은 값}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-43200}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}

      # -----------------------------------------------------------------
      # 실행 환경과 계정.
      #
      # --env-file 은 이 파일의 ${...} 치환에만 쓰이고 컨테이너 안으로는 들어가지
      # 않는다. 그래서 여기 적지 않은 변수는 .env.web 에 있어도 앱이 못 본다 —
      # APP_ENV 가 빠져 있던 동안 운영 컨테이너가 local 로 떠서 기본 비밀번호
      # (admin1234) 로 로그인이 됐다. 앱이 읽는 값은 전부 여기 명시한다.
      #
      # :? 는 비어 있으면 compose 단계에서 멈춘다. 앱의 require_secrets 가 한 번
      # 더 막지만, 컨테이너가 CrashLoop 도는 것보다 up 이 안 되는 쪽이 빨리 보인다.
      # -----------------------------------------------------------------
      APP_ENV: ${APP_ENV:-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 를 .env.web 에 설정하세요}
      CLIENT_USERNAME: ${CLIENT_USERNAME:-client}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:?CLIENT_PASSWORD 를 .env.web 에 설정하세요}
      # client 계정이 올린 매물을 연결할 판매자. 0 이면 client 는 업로드만 되고
      # 어떤 매물도 수정(사진 등)하지 못한다 — 소유 검사가 판매자 일치로 판단한다.
      CLIENT_SELLER_ID: ${CLIENT_SELLER_ID:-1}

      # -----------------------------------------------------------------
      # DB 부가 설정.
      # -----------------------------------------------------------------
      # 읽기 복제본. 비우면 DATABASE_URL 로 떨어진다.
      DATABASE_RO_URL: ${DATABASE_RO_URL:-}
      # DB 연결 암호화. RDS 면 require. EC2 자체 postgres 가 TLS 를 안 켰으면
      # prefer 로 둬야 붙는다 (운영에서 prefer 면 기동 로그에 경고가 남는다).
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}

      # -----------------------------------------------------------------
      # 이미지 저장소. S3_BUCKET 이 있으면 S3, 없으면 로컬 디스크.
      # 운영에서 둘 다 비어 있으면 앱이 기동을 거부한다 — 3대가 각자 디스크에
      # 쓰면 사진이 서버마다 다르게 보이기 때문이다. 단일 호스트 시연에서만
      # ALLOW_LOCAL_STORAGE=true 로 눌러 쓴다.
      # -----------------------------------------------------------------
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      ALLOW_LOCAL_STORAGE: ${ALLOW_LOCAL_STORAGE:-false}

      # 호출 제한 (0 이면 끔). ALB 뒤라 TRUST_PROXY_HEADERS 는 APP_ENV 를 따라 켜진다.
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LIVE_SEARCH_RATE_LIMIT: ${LIVE_SEARCH_RATE_LIMIT:-10}
      CLICK_RATE_LIMIT: ${CLICK_RATE_LIMIT:-60}
      CLICK_NEW_SESSION_LIMIT: ${CLICK_NEW_SESSION_LIMIT:-30}

      # -----------------------------------------------------------------
      # X-Forwarded-For 를 믿어줄 대역.
      #
      # 체인이 한 단계다:  클라이언트 → ALB → uvicorn
      # ALB 가 X-Forwarded-For 에 클라이언트 IP 를 넣어 주므로, uvicorn 은
      # ALB 의 사설 IP(VPC 대역)에서 온 헤더만 믿으면 된다.
      # nginx 를 걷어내면서 도커 대역을 신뢰할 필요가 없어졌다.
      #
      # 이 헤더는 누구나 붙일 수 있다. 대역을 좁히지 않으면 클라이언트가 자기 IP 를
      # 위조할 수 있어 접속 로그가 오염되고 IP 기반 제한도 무의미해진다.
      # -----------------------------------------------------------------
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.0.0.0/16}
    healthcheck:
      # DB 와 스키마까지 확인하는 /ready 를 본다.
      # ALB 의 헬스체크 대상도 /ready 다(10초 간격, 2회 실패 시 제외).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped
