# .github/workflows/ci.yml
#
# 푸시와 PR마다 lint -> test -> 이미지 빌드를 돌린다.
#
# 세 잡을 나눈 이유: lint는 금방 끝나므로 먼저 실패하면 나머지를 기다릴 필요가 없고,
# 이미지 빌드는 몇 분 걸리는 데다 테스트가 통과하지 않은 코드를 굽는 건 낭비다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다. 최신 커밋 결과만 의미가 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 크롤러 코드까지 검사해야 하므로 extra를 포함한다.
      - name: 의존성 설치
        run: uv sync --extra crawler

      - name: ruff check
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest

    services:
      # 실제 Postgres를 띄운다. SQLite로 대체하지 않는 이유는 검증 대상 대부분이
      # Postgres 고유 동작이기 때문이다 — ON CONFLICT, timestamptz, ilike.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudedx
          POSTGRES_PASSWORD: cloudedx
          POSTGRES_DB: cloudedx_test
        ports:
          - 5432:5432
        # 컨테이너가 접속을 받기 전에 테스트가 시작되지 않게 한다.
        options: >-
          --health-cmd "pg_isready -U cloudedx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cloudedx:cloudedx@127.0.0.1:5432/cloudedx_test
      DATABASE_URL: postgresql+asyncpg://cloudedx:cloudedx@127.0.0.1:5432/cloudedx_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Playwright(crawler extra)를 일부러 설치하지 않는다. 백엔드 이미지와 같은
      # 구성으로 테스트가 도는지 확인하는 효과가 있다 — 백엔드 코드가 실수로
      # 크롤러 모듈을 최상단에서 임포트하면 여기서 걸린다.
      - name: 의존성 설치 (백엔드 구성)
        run: uv sync

      - name: 마이그레이션 적용 및 모델과 일치 확인
        run: |
          uv run alembic upgrade head
          # 자동 생성할 것이 남아 있으면 실패한다. 모델을 고치고 마이그레이션을
          # 만들지 않은 경우가 여기서 걸린다.
          uv run alembic check

      - name: 테스트
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    strategy:
      # 하나가 실패해도 다른 이미지 빌드 결과는 보고 싶다.
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: dockerfile.backend
          - name: crawler
            dockerfile: dockerfile.crawler

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ${{ matrix.name }} 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 레지스트리에 올리지 않는다. 지금은 "빌드가 깨지지 않는가"만 확인한다.
          push: false
          load: true
          tags: cloudedx-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 백엔드가 Playwright 없이 임포트되는지 확인
        if: matrix.name == 'backend'
        # DB가 없으므로 서버를 띄우지는 않고 임포트만 확인한다.
        run: docker run --rm cloudedx-backend:ci python -c "import app.main; print('ok')"