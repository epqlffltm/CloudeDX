; alembic.ini
;
; NOTE: This file must stay ASCII-only.
; Alembic reads it with encoding="locale", which is CP949 on Korean Windows.
; Non-ASCII characters (including Korean comments) cause UnicodeDecodeError.
; Korean explanations live in alembic/env.py and README.md instead.
;
; The DB URL is NOT written here on purpose - alembic/env.py reads DATABASE_URL
; from .env so that credentials never get committed.

[alembic]
script_location = alembic

; Revision filenames include a timestamp and a slug. The default (hash only)
; makes the versions/ folder unreadable once there are more than a few files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

; Record revision timestamps in UTC so that teammates in different timezones
; do not produce out-of-order history.
timezone = UTC

prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S