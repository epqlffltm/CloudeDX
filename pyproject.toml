[project]
name = "cloudedx"
version = "0.1.0"
description = "중고 명품 가방 매물 수집 및 조회 서비스"
readme = "README.md"
requires-python = ">=3.13"

# 백엔드(게시판 + JSON API)가 돌아가는 데 필요한 것만 둔다.
# 여기에 Playwright가 없는 것이 핵심이다 — 백엔드 이미지에서 1GB 넘게 덜어낸다.
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
# 크롤러 전용. dockerfile.crawler와 로컬 개발에서만 설치한다.
#   uv sync --extra crawler
crawler = [
    "playwright>=1.62.0",
    "httpx>=0.28.1",
]

# 로컬 개발에서는 크롤러까지 함께 돌리므로 `uv sync --extra crawler` 를 쓴다.
# extra는 기본으로 설치되지 않기 때문에, 그냥 `uv sync` 를 치면 백엔드 이미지와
# 같은 구성이 된다 — 백엔드가 Playwright 없이도 뜨는지 로컬에서 바로 확인할 수 있다.

[dependency-groups]
# 개발/테스트 전용. uv sync가 기본으로 설치하고, 이미지 빌드에서는 --no-dev로 뺀다.
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# 비동기 테스트에 매번 마커를 붙이지 않아도 되게 한다.
# 프로젝트 루트를 sys.path에 넣어 app.* 를 임포트할 수 있게 한다.
# 이 프로젝트는 패키지로 설치하지 않고 소스를 그대로 실행하는 구조라 필요하다.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort — 임포트 정렬
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    # 줄 길이는 formatter가 처리한다. 주석에 설명을 길게 쓰는 편이라 여기서 막지 않는다.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Alembic이 생성하는 리비전 파일은 형식이 고정돼 있어 손대지 않는다.
"alembic/versions/*" = ["E", "F", "I", "UP", "B"]

