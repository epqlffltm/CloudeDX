# docker-compose.prod.yml
#
# AWS EC2 배포용 구성. 로컬 개발용 docker-compose.yml 과 별도 파일로 둔다.
#
# 실행:
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# -f 로 파일을 명시하는 이유: 인자 없이 `docker compose up` 을 하면 도커가
# docker-compose.yml 과 docker-compose.override.yml 을 자동으로 합친다.
# override 에는 소스 마운트와 --reload 가 들어 있어서 배포에 섞이면 안 된다.
#
# 로컬 구성과 다른 점:
#   - backend 를 3대로 늘리고 호스트 포트를 노출하지 않는다 (nginx 만 80을 연다)
#   - db 도 호스트 포트를 열지 않는다 (EC2 보안그룹과 별개로 한 겹 더 막는다)
#   - 시크릿에 기본값을 주지 않는다. 미설정이면 기동 자체가 실패한다
#   - 로그를 JSON 으로 고정한다 (CloudWatch Logs Insights 가 필드로 질의)

# ---------------------------------------------------------------------------
# 컨테이너 네트워크 대역을 고정한다.
#
# 도커가 알아서 잡게 두면 172.17~172.31 중 어디가 될지 모른다. uvicorn 의
# --forwarded-allow-ips 에 "신뢰할 프록시 대역"을 적어야 하는데, 대역이 매번
# 달라지면 그 값을 쓸 수가 없다. 여기서 못 박아두면 백엔드가 "이 대역에서 온
# X-Forwarded-For 만 믿는다"고 선언할 수 있다.
# ---------------------------------------------------------------------------
networks:
  cloudedx:
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ---------------------------------------------------------------------------
# DB 접속 문자열은 여기서만 조립한다.
#
# :? 는 "변수가 없거나 비어 있으면 오류 메시지를 내고 중단"이라는 뜻이다.
# 로컬 구성처럼 :- 로 기본값을 주면, .env.prod 를 빠뜨렸을 때 개발용 비밀번호로
# 조용히 떠버린다. 그런 실수는 뜨는 순간이 아니라 한참 뒤에 발견된다.
# ---------------------------------------------------------------------------
x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER 를 .env.prod 에 설정하세요}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env.prod 에 설정하세요}@db:5432/${POSTGRES_DB:?POSTGRES_DB 를 .env.prod 에 설정하세요}

# ---------------------------------------------------------------------------
# 로그 드라이버 공통 설정.
#
# 기본값(json-file, 무제한)으로 두면 EC2 디스크가 로그로 가득 찬다. t3.small
# 기본 볼륨이 8GB 인데 크롤러가 30분마다 도는 서비스라 몇 주면 찬다. 디스크가
# 꽉 차면 Postgres 가 먼저 쓰기를 거부하므로 증상이 로그와 무관하게 나타난다.
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # 리버스 프록시.
  #
  # 이 컨테이너만 호스트 포트를 연다. 나머지는 도커 네트워크 안에서만 통신한다.
  # EC2 보안그룹에서 80(과 443)만 열어두면 외부에서 백엔드나 DB에 직접 닿을
  # 방법이 없다.
  # ---------------------------------------------------------------------------
  nginx:
    # 설정을 바인드 마운트하지 않고 이미지에 굽는다. 이유는 nginx/Dockerfile
    # 주석 참고 — 요약하면 Windows 에서 단일 파일 마운트가 불안정하고,
    # 배포 시 이미지만 옮기면 되기 때문이다.
    build:
      context: ./nginx
    # 빌드 결과에 이름을 붙여둔다. GHCR 로 옮길 때 이 변수만 바꾸면 된다.
    image: ${NGINX_IMAGE:-cloudedx-nginx:latest}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudedx
    logging: *default-logging
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # 호스트 포트를 열지 않는다. 로컬 구성에서는 psql/DBeaver 로 들여다보려고
    # 열어뒀지만, 배포에서는 그 편의가 곧 공격면이다. 확인이 필요하면
    # `docker compose exec db psql -U ...` 로 컨테이너 안에서 접속한다.
    volumes:
      - cloudedx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudedx
    logging: *default-logging
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 일회성 마이그레이션.
  #
  # backend 가 3대이므로 이 분리가 로컬보다 더 중요하다. 세 대가 동시에
  # alembic upgrade 를 돌리면 서로 같은 리비전을 적용하려 들면서 락 경합이나
  # 중복 적용이 일어난다.
  # ---------------------------------------------------------------------------
  migrate:
    image: ${BACKEND_IMAGE:-cloudedx-backend:latest}
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudedx
    logging: *default-logging
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-cloudedx-backend:latest}
    # -------------------------------------------------------------------
    # 3대로 띄운다.
    #
    # replicas 를 쓰려면 ports 매핑이 없어야 한다. 3대가 같은 호스트 포트를
    # 잡으려 들면 두 번째부터 바인딩에 실패하기 때문이다. expose 는 호스트에
    # 열지 않고 "같은 도커 네트워크의 다른 컨테이너에게만" 포트를 알린다.
    #
    # container_name 도 지정하면 안 된다 — 이름이 겹친다. 도커가
    # cloudedx-backend-1/2/3 으로 알아서 붙인다.
    # -------------------------------------------------------------------
    deploy:
      replicas: 3
    expose:
      - "8000"
    environment:
      <<: *db-env
      ENABLE_CRAWLER: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 배포에서는 JSON 으로 고정한다. CloudWatch Logs Insights 나 Loki 가
      # 필드 단위로 질의하려면 한 줄 JSON 이어야 한다.
      LOG_FORMAT: json
      # -----------------------------------------------------------------
      # 세션 서명 키. 여기서는 기본값을 주지 않는다.
      #
      # 3대가 각자 다른 키를 만들면 nginx 가 요청을 분배할 때마다 다른
      # 컨테이너로 가면서 로그인이 붙었다 풀렸다 한다. 로컬에서는 시연용
      # 고정값으로 넘어갔지만, 배포에서 이 값이 비어 있는 것은 설정 누락이지
      # 선택이 아니다. 그래서 :? 로 기동을 막는다.
      # -----------------------------------------------------------------
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 를 .env.prod 에 설정하세요}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-43200}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      # -----------------------------------------------------------------
      # 신뢰할 프록시 대역.
      #
      # uvicorn 은 X-Forwarded-For 헤더를 보고 클라이언트 IP 를 판단하는데,
      # 아무나 그 헤더를 붙일 수 있으므로 "누가 보낸 헤더를 믿을지"를 정해야
      # 한다. 위에서 고정한 서브넷만 신뢰하면, 외부에서 직접 위조 헤더를
      # 보내도 백엔드까지 닿지 않는다(애초에 nginx 만 노출돼 있으므로).
      #
      # Dockerfile 의 CMD 에는 "*" 가 박혀 있는데, 이 환경변수를 읽어
      # 덮어쓰도록 CMD 를 함께 수정한다(아래 dockerfile.backend 참고).
      # -----------------------------------------------------------------
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.0/16}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # nginx 의 depends_on 기준이 된다. DB 와 스키마까지 확인하는 /ready 를 본다.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cloudedx
    logging: *default-logging
    restart: unless-stopped

  crawler:
    image: ${CRAWLER_IMAGE:-cloudedx-crawler:latest}
    # 크롤러는 1대만 띄운다. 여러 대가 같은 사이트를 동시에 긁으면 수집이
    # 중복되고 차단 위험만 올라간다. backend 와 달리 수평 확장 대상이 아니다.
    environment:
      <<: *db-env
      CRAWL_INTERVAL_MINUTES: ${CRAWL_INTERVAL_MINUTES:-30}
      CRAWL_RETRY_MINUTES: ${CRAWL_RETRY_MINUTES:-5}
      CRAWL_RUN_TIMEOUT_MINUTES: ${CRAWL_RUN_TIMEOUT_MINUTES:-60}
      JOONGNA_PAGES_PER_BRAND: ${JOONGNA_PAGES_PER_BRAND:-3}
      BUNJANG_PAGES_PER_JOB: ${BUNJANG_PAGES_PER_JOB:-3}
      MISSING_THRESHOLD: ${MISSING_THRESHOLD:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    shm_size: 1gb
    volumes:
      - cloudedx_crawler_data:/srv/data
    networks:
      - cloudedx
    logging: *default-logging
    restart: unless-stopped

volumes:
  cloudedx_pgdata:
  cloudedx_crawler_data:
