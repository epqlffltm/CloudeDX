# nginx/nginx.conf
#
# backend 3대 앞에 서는 리버스 프록시.
# 컨테이너의 /etc/nginx/conf.d/default.conf 로 마운트된다 — 즉 이 파일은
# nginx.conf 전체가 아니라 http 블록 안에 들어가는 조각이다. worker_processes 나
# events 블록이 없는 것은 그 때문이다.

# ---------------------------------------------------------------------------
# 도커 내장 DNS.
#
# 여기가 이 설정에서 가장 중요한 부분이다.
#
# 흔히 쓰는 방식은 upstream 블록에 서버를 나열하는 것인데, 그러면 nginx 가
# 기동할 때 호스트명을 한 번만 해석하고 그 IP 를 계속 쓴다. backend 컨테이너가
# 재시작되면서 IP 가 바뀌어도 nginx 는 옛 IP 로 계속 보내고, 결과는 502 다.
# replicas 로 띄운 컨테이너는 재시작이 잦으므로 이 함정에 걸리기 쉽다.
#
# 대신 proxy_pass 에 변수를 쓰면 nginx 가 요청마다 DNS 를 다시 묻는다.
# 127.0.0.11 은 도커가 각 컨테이너에 넣어주는 내장 DNS 이고, backend 를 물으면
# 3대의 IP 를 돌아가며 돌려준다 — 로드밸런싱을 도커 DNS 가 해주는 셈이다.
#
# 트레이드오프: upstream 블록을 안 쓰므로 least_conn 같은 분배 알고리즘이나
# keepalive 커넥션 풀을 못 쓴다. 이 규모에서는 DNS 라운드로빈으로 충분하고,
# 죽은 컨테이너를 물지 않는 쪽이 더 중요하다.
#
# valid=10s 는 DNS 캐시 수명이다. 짧을수록 컨테이너 교체에 빨리 따라가지만
# 요청당 DNS 조회가 늘어난다. ipv6=off 는 도커 네트워크가 IPv4 만 쓰는데
# nginx 가 AAAA 를 함께 묻다가 지연이 생기는 것을 막는다.
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# 액세스 로그 포맷.
#
# 어느 백엔드로 갔는지($upstream_addr)와 그 백엔드가 응답에 걸린 시간
# ($upstream_response_time)을 남긴다. 기본 포맷에는 이 둘이 없어서 3대 중
# 어디로 분배됐는지 알 수 없다. 분산이 실제로 도는지 확인하는 용도이자,
# 배포 후 "특정 인스턴스만 느리다"는 상황에서 범인을 지목할 근거가 된다.
#
# 백엔드(uvicorn)의 액세스 로그는 꺼져 있으므로 요청 단위 기록은 여기가
# 정본이다. 애플리케이션 로그는 이벤트만, 요청 기록은 프록시가 담당하는 편이
# 역할 분리가 깔끔하다.
#
# log_format 은 http 컨텍스트 지시어라 server 블록 안에 둘 수 없다
# (nginx: [emerg] "log_format" directive is not allowed here).
# 이 파일은 conf.d/ 로 들어가 http 안에서 include 되므로, server 바깥이
# 곧 http 컨텍스트다. access_log 는 server 안에서 이 포맷을 참조한다.
# ---------------------------------------------------------------------------
log_format upstream_log '$remote_addr -> $upstream_addr '
                        '"$request" $status '
                        '${upstream_response_time}s';

server {
    listen 80;
    server_name _;

    # 응답 헤더에서 nginx 버전을 숨긴다. 알려진 취약점이 있는 버전을
    # 스캐너에게 알려줄 이유가 없다.
    server_tokens off;

    access_log /var/log/nginx/access.log upstream_log;

    # CSV 업로드가 있다. 기본값 1MB 로 두면 백엔드의 MAX_UPLOAD_BYTES(5MB)에
    # 닿기도 전에 nginx 가 413 을 뱉는다. 두 값을 맞춰둔다.
    client_max_body_size 5m;

    # 크롤링 결과가 많을 때 목록 응답이 커진다. 텍스트 계열만 압축한다 —
    # 이미지는 이미 압축돼 있어 CPU 만 쓰고 크기는 안 줄어든다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # 로드밸런서 헬스체크용.
    #
    # 이 경로만 nginx 가 직접 응답한다. 백엔드까지 가지 않으므로 "nginx 는
    # 살아있지만 백엔드가 전부 죽은" 상태를 구분할 수 있다. ALB 를 앞에 둘
    # 때는 ALB 의 헬스체크 대상을 /nginx-health 가 아니라 /ready 로 잡아야
    # 백엔드 상태까지 반영된다 — 여기는 nginx 자체 확인용이다.
    #
    # access_log off: 헬스체크는 몇 초마다 오므로 로그를 남기면 실제 트래픽이
    # 묻힌다.
    # -----------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # 변수에 담아야 요청마다 DNS 를 다시 해석한다. 문자열을 직접 쓰면
        # (proxy_pass http://backend:8000;) 기동 시 한 번만 해석된다.
        set $upstream http://backend:8000;
        proxy_pass $upstream;

        proxy_http_version 1.1;

        # ---------------------------------------------------------------
        # 원래 요청 정보를 백엔드에 전달한다.
        #
        # 이게 없으면 백엔드가 보는 클라이언트 IP 가 전부 nginx 컨테이너의
        # 것이 된다 — 접속 로그가 무의미해지고, IP 기반 제한도 걸 수 없다.
        #
        # $proxy_add_x_forwarded_for 는 기존 헤더가 있으면 뒤에 이어 붙인다.
        # ALB 를 앞에 두면 "실제IP, ALB IP" 처럼 체인이 쌓이고, uvicorn 은
        # 신뢰 대역을 제외한 가장 오른쪽 값을 클라이언트로 본다.
        # ---------------------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 크롤링 통계 집계처럼 오래 걸리는 요청이 있다. 기본 60초로는
        # 504 가 날 수 있어 넉넉히 잡는다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ---------------------------------------------------------------
        # 실패한 요청을 다음 컨테이너로 재시도한다.
        #
        # 3대 중 하나가 재시작 중이면 그 컨테이너로 간 요청은 실패한다.
        # 여기서 다음 대상으로 넘기면 사용자는 아무것도 눈치채지 못한다.
        #
        # non_idempotent 를 넣지 않는다 — POST 를 재시도하면 CSV 업로드가
        # 두 번 처리될 수 있다. 안전한 GET/HEAD 만 다시 보낸다.
        # ---------------------------------------------------------------
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
